[project]
name = "oura-py"
version = "0.3.0"
description = "A python wrapper for Oura Ring's V2 API."
authors = [{ name = "Collin Smith", email = "collinmsmith22@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests-oauthlib>=2.0.0",
    "requests>=2.32.3",
    "pydantic>=2.10",
]

[project.urls]
GitHub = "https://github.com/col-ms/oura-py"


[build-system]
requires = ["uv_build>=0.8.14,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pylint>=3.3.4",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "ngrok>=1.7.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.9.6",
    "ty>=0.0.75",
]
