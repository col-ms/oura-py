name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run pytest --cov=oura_py --cov-report=term-missing

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    name: Install ${{ matrix.distribution }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        distribution: [wheel, sdist]

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install the distribution in a clean environment
        run: |
          python -m venv .venv-install
          .venv-install/bin/python -m pip install --upgrade pip
          if [ "${{ matrix.distribution }}" = "wheel" ]; then
            package=$(find dist -name '*.whl' -print -quit)
          else
            package=$(find dist -name '*.tar.gz' -print -quit)
          fi
          .venv-install/bin/python -m pip install "$package"
          .venv-install/bin/python -m pip check
      - name: Verify the standard installation
        run: |
          .venv-install/bin/python -c "from importlib.resources import files; from oura_py.data import models; assert models.PersonalInfo; assert files('oura_py').joinpath('py.typed').is_file()"
